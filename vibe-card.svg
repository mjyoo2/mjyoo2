<svg xmlns="http://www.w3.org/2000/svg" width="800" height="334" viewBox="0 0 800 334">
  <style>
    .title { font: 600 20px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .stat-label { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .stat-value { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .stat-value-small { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .section-title { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .model-label { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .footer { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="799" height="333" rx="4.5" fill="#0d1117" stroke="#30363d"/>

  <!-- Title -->
  <text x="25" y="35" class="title">🎸 Vibe Coding Dashboard</text>

  <!-- Stats Row -->
  <g transform="translate(25, 60)">
