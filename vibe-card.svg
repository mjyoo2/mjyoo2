  </g>
  <!-- Weekly Usage Chart -->
  <g transform="translate(25, 105)">
    <rect x="0" y="0" width="750" height="60" rx="4" fill="#161b22"/>
    <rect x="10" y="5" width="237" height="40" rx="3" fill="#58a6ff"/>
    <text x="128.5" y="55" text-anchor="middle" class="model-label">12/08</text>
    <rect x="253" y="40.306046935777175" width="237" height="4.693953064222821" rx="3" fill="#58a6ff"/>
    <text x="371.5" y="55" text-anchor="middle" class="model-label">12/17</text>
    <rect x="496" y="43" width="237" height="2" rx="3" fill="#58a6ff"/>
